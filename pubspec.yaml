name: zoodex
description: "ZooDex - track which species you've seen at each zoo you visit."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # UI string translation (gen-l10n / ARB files)
    sdk: flutter
  intl: ^0.20.2 # locale-aware formatting; version is pinned by flutter_localizations
  cupertino_icons: ^1.0.8
  hive: ^2.2.3 # lightweight on-device key/value storage
  hive_flutter: ^1.1.0
  geolocator: ^13.0.1 # GPS, used to confirm a visitor is at the zoo + centre the map
  flutter_map: ^8.3.0 # OpenStreetMap-based map view in the Zoos tab (no API key)
  latlong2: ^0.9.1 # LatLng type used by flutter_map
  share_plus: ^13.1.0 # native share sheet for exporting data (mobile/desktop)
  path_provider: ^2.1.0 # temp dir to write the export file before sharing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  # Whole folders are declared as assets, so dropping a new zoos.json or a new
  # inventory file into them ships it without editing this file. (Sub-folders
  # aren't included automatically, which is why inventories/ is listed too.)
  assets:
    - assets/data/
    - assets/data/inventories/
    # Per-language catalogue overlays (translated common names, descriptions).
    # Sub-folders are not auto-included, so each locale is listed explicitly.
    - assets/data/i18n/en/
    - assets/data/i18n/fr/
    - assets/data/i18n/de/
    - assets/data/i18n/es/
    - assets/data/i18n/cy/
    - assets/icons/
    - assets/range/
    - images/

